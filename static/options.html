<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neleceni</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field > span { font-weight: 600; font-size: 13px; }
      .field > span.hint { font-weight: 400; font-size: 12.5px; }
      .stack > * + * { margin-top: 12px; }
      .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; position: sticky; bottom: 0;
        background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); }
      #saved { color: var(--ok); font-weight: 600; }
      kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
    </style>
  </head>
  <body data-i18n-title="optTitle">
    <main>
      <form id="form">
        <div class="top">
          <div>
            <h1 data-i18n="optTitle"></h1>
            <p class="hint" data-i18n="optIntro"></p>
            <p class="hint" data-i18n="optPrivacy"></p>
          </div>
          <label class="field">
            <span data-i18n="optLanguage"></span>
            <select name="language">
              <option value="auto" data-i18n="optLangAuto"></option>
              <option value="sr">Српски (ћирилица)</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>

        <section class="stack">
          <label class="check"><input type="checkbox" name="enabled" /> <strong data-i18n="optEnabled"></strong></label>
          <label class="field">
            <span data-i18n="optSpeakers"></span>
            <textarea name="speakers" rows="3" spellcheck="false"></textarea>
            <span class="hint" data-i18n="optSpeakersHint"></span>
          </label>
          <label class="field">
            <span data-i18n="optGroups"></span>
            <textarea name="groups" rows="2" spellcheck="false"></textarea>
            <span class="hint" data-i18n="optGroupsHint"></span>
          </label>
          <label class="field">
            <span data-i18n="optChannels"></span>
            <textarea name="channels" rows="2" spellcheck="false"></textarea>
            <span class="hint" data-i18n="optChannelsHintHtml"></span>
          </label>
        </section>

        <section class="stack">
          <h2 data-i18n="optRegion"></h2>
          <p class="hint" data-i18n="optRegionHint"></p>
          <div class="row">
            <label class="field"><span data-i18n="optLeft"></span><input type="number" name="region.x" min="0" max="99" step="0.5" /></label>
            <label class="field"><span data-i18n="optTop"></span><input type="number" name="region.y" min="0" max="99" step="0.5" /></label>
            <label class="field"><span data-i18n="optWidth"></span><input type="number" name="region.w" min="1" max="100" step="0.5" /></label>
            <label class="field"><span data-i18n="optHeight"></span><input type="number" name="region.h" min="1" max="100" step="0.5" /></label>
          </div>
        </section>

        <section class="stack">
          <h2 data-i18n="optDetection"></h2>
          <div class="row">
            <label class="field"><span data-i18n="optInterval"></span><input type="number" name="intervalMs" min="500" max="10000" step="100" /></label>
            <label class="field"><span data-i18n="optWhite"></span><input type="number" name="whiteThreshold" min="100" max="255" /></label>
            <label class="field"><span data-i18n="optLangs"></span>
              <select name="langs">
                <option value="srp" data-i18n="optLangsSrp"></option>
                <option value="srp+srp_latn" data-i18n="optLangsBoth"></option>
                <option value="srp_latn" data-i18n="optLangsLatn"></option>
              </select>
            </label>
          </div>
          <p class="hint" data-i18n="optWhiteHint"></p>
          <div class="row">
            <label class="field"><span data-i18n="optConfirmations"></span><input type="number" name="otherConfirmations" min="1" max="10" /></label>
            <label class="field"><span data-i18n="optMinConfidence"></span><input type="number" name="minConfidence" min="0" max="100" /></label>
            <label class="field"><span data-i18n="optReleaseAfter"></span><input type="number" name="releaseAfterGoneSec" min="0" max="3600" /></label>
          </div>
          <p class="hint" data-i18n="optDetectionHint"></p>
        </section>

        <section class="stack">
          <h2 data-i18n="optDisplay"></h2>
          <label class="check"><input type="checkbox" name="showBadge" /> <span data-i18n="optShowBadge"></span></label>
          <label class="check"><input type="checkbox" name="debug" /> <span data-i18n="optDebug"></span></label>
          <p class="hint" data-i18n="optShortcutHtml"></p>
        </section>

        <div class="actions">
          <button type="submit" class="primary" data-i18n="optSave"></button>
          <button type="button" id="reset" data-i18n="optReset"></button>
          <span id="saved" role="status"></span>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
